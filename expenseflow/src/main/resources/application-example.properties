spring.application.name=expenseflow

# Copy these values into environment variables or a local application-local.properties file.
# Do not commit real passwords or JWT secrets.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Local React development origin by default. In production, set FRONTEND_ORIGIN to your deployed frontend URL.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
